<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>File-Oriented Editorial POC — Static Preview</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .static-shell{max-width:1100px;margin:0 auto;padding:24px 16px 80px}.static-controls{max-width:760px;margin:0 auto 32px;padding:18px;border:1px solid #b8ad9b;border-radius:10px;background:#fffaf0}.dropzone{display:block;padding:24px;border:2px dashed #9f9382;border-radius:8px;text-align:center;cursor:pointer;background:#f6f1e8}.dropzone.drag{background:#ece3d4}.dropzone input{display:none}.static-note{margin:.65rem 0 0;color:#655f56;font-size:.9rem}.status{font:600 .82rem/1.4 ui-monospace,monospace;color:#5f5a50;margin-top:10px}.asset-placeholder{margin:36px auto;max-width:980px}.component-static{max-width:980px;margin:44px auto 68px;padding:18px;border:1px solid #b8ad9b;border-radius:10px;background:#ede7dc}.component-static .asset-placeholder{margin:14px 0}.component-static .hotspot-demo{margin-top:12px;padding:12px;border-radius:8px;background:#fffaf0}.inline-code{font:600 .92em/1.2 ui-monospace,monospace;background:#e7e0d3;padding:.12em .35em;border-radius:4px}
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <strong>PILOT 01C · STATIC PREVIEW</strong>
      <span id="static-status">CHƯA NẠP CONTENT.md</span>
    </div>
  </header>
  <div class="static-shell">
    <section class="static-controls">
      <label id="dropzone" class="dropzone">
        <strong>Chọn hoặc kéo CONTENT.md vào đây</strong><br />
        <span>Không cần Node, npm hay local server.</span>
        <input id="content-file" type="file" accept=".md,text/markdown,text/plain" />
      </label>
      <p class="static-note">Do giới hạn bảo mật của Safari khi mở file trực tiếp từ Finder, trang không thể tự đọc <span class="inline-code">CONTENT.md</span> nằm bên cạnh. Anh chỉ cần chọn file sau mỗi lần sửa.</p>
      <div id="load-status" class="status">Đang chờ CONTENT.md…</div>
    </section>
    <article id="poc-content"></article>
  </div>
  <script src="static-preview.js"></script>
</body>
</html>
